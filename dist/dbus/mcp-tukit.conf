<?xml version="1.0"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  mcp-server-tukit behind mcp-gateway runs as mcp-tukit and calls tukitd,
  which tukitd's own policy (org.opensuse.tukit.conf) allows root only.
  Installed as /usr/share/dbus-1/system.d/mcp-tukit.conf.

  tukitd checks nothing beyond this: whoever runs as mcp-tukit can run
  commands as root in new snapshots. Only the gateway starts processes
  as this account (no login, no shell), and its policy decides who may
  call which tool, with whose approval.
-->
<busconfig>
  <policy user="mcp-tukit">
    <allow send_destination="org.opensuse.tukit" send_interface="org.opensuse.tukit.Transaction"/>
    <allow send_destination="org.opensuse.tukit" send_interface="org.opensuse.tukit.Snapshot"/>
  </policy>
</busconfig>
