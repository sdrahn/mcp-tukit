# The roles of the server tukit, installed as
# /usr/share/mcp-gateway/policy/mcp/profiles/tukit/data.yaml.
# Bind users or groups to them in the role data (chapter 13 of the
# mcp-gateway user guide).

version: 1
roles:
  tukit-reader:
    description: 'tukit: snapshots of the root file system, whether a reboot is pending, and the updates available'
    permissions:
      - {server: tukit, tool: get_status}
      - {server: tukit, tool: list_snapshots}
      - {server: tukit, tool: list_updates}
  tukit-operator:
    description: 'tukit-reader, refresh the repositories, and with approval: install, remove and update packages in new snapshots, roll back, delete and clean up snapshots, apply, reboot'
    permissions:
      - {server: tukit, tool: get_status}
      - {server: tukit, tool: list_snapshots}
      - {server: tukit, tool: list_updates}
      # Changes only zypper's repository cache.
      - {server: tukit, tool: refresh_repositories}
      - server: tukit
        tool: rollback
        require_approval: true
        approval_channel: oob
        approval_scopes: [once]
      # Changes the running system: an approval for each apply.
      - server: tukit
        tool: apply
        require_approval: true
        approval_channel: oob
        approval_scopes: [once]
      # Takes the system down: an approval for each reboot.
      - server: tukit
        tool: reboot
        require_approval: true
        approval_channel: oob
        approval_scopes: [once]
      # Offered only with --allow-commands: any command, as root.
      - server: tukit
        tool: run_in_snapshot
        require_approval: true
        approval_channel: oob
        approval_scopes: [once]
      - server: tukit
        tool: '*'
        require_approval: true
        approval_channel: oob
        approval_scopes: [once, session, 1h]
