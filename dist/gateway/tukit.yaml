# mcp-server-tukit (https://github.com/sdrahn/mcp-tukit) behind
# mcp-gateway: transactional updates on immutable SUSE systems (openSUSE
# MicroOS, Leap Micro, SL Micro, SLES 16.1 in immutable mode) through
# tukitd. Installed as /usr/share/mcp-gateway/servers.d/tukit.yaml.
#
# Not a privileged server: the instance runs in the gateway's sandbox
# (no capabilities, NoNewPrivileges, read-only system, no network) as
# the account mcp-tukit; tukitd, which the D-Bus policy
# /usr/share/dbus-1/system.d/mcp-tukit.conf lets that account call, does
# the work in the new snapshot. Its reboot tool starts the unit
# mcp-tukit-reboot.service (transactional-update reboot), which polkit
# allows the account and nothing else. Roles: tukit-reader,
# tukit-operator (every change approved, every reboot by itself).
version: 1
name: tukit
command: ["/usr/bin/mcp-server-tukit"]
run_as: mcp-tukit
selinux_type: mcpsrv_tukit_t
# No network: zypper runs in tukitd, not in the instance, and the system
# bus is a unix socket.
network: false
# Landlock (a second wall): the system's configuration and programs
# only; the server reads and writes no files of its own.
landlock: {}
tool_notes:
  pkg_install: >-
    Changes take effect at the next reboot (the tool reboot, which needs
    an approval of its own). Several changes before a reboot add up
    (each builds on the default snapshot).
  update_system: >-
    Can take many minutes. On SL Micro and Leap Micro use mode update
    (or patch); dist-upgrade is for MicroOS.
